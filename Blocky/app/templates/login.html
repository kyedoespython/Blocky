{% extends "base.html" %}

{% block content %}

<h1>Login to your blocky account</h1>

<form action="/send_login">

    <input type="text" id="username" placeholder="Create a username" minlength="3" maxlength="20" required>
    <input type="email" id="email" placeholder="Connect your email" minlength="3" maxlength="100" required>
    <input type="password" id="password" placeholder="Create a password" minlength="6" maxlength="32" required>

    <button type="submit">Login</button>
    
    <p>Dont have an account yet? <a href="/Join-Blocky">Join us</a></p>

</form>

{% endblock %}
